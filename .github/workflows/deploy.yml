name: Deploy CV to GitHub Pages

on:
  push:
    branches:
      - develop
  workflow_dispatch:  # Allows manual triggering

# Sets permissions of the GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # or your preferred Node version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          API_TOKEN: ${{ secrets.API_TOKEN_PROD }}
        run: |
          npm run build -- --configuration=production --base-href="/${{ github.event.repository.name }}/"
        # Note: Adjust the base-href according to your repository name

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/cv/browser'  # Adjust this path to match your Angular 18 output directory

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4